# ==============================================================================
# Apache2 Reverse Proxy Configuration (Cloudflare Tunnel & Subpath Support)
# Deployment target: /etc/apache2/sites-available/github-description.conf
# または既存の VirtualHost (zyuuuukak1n.dev) 内へ Include / 追記
# ==============================================================================
#
# 【公開URL】https://zyuuuukak1n.dev/tool/github-description/
# 【転送先】  http://127.0.0.1:8085/
#
# ==============================================================================

# ------------------------------------------------------------------------------
# パターン1: 既存の VirtualHost 内に追記、または Include して利用する場合 (推奨)
# 例: /etc/apache2/sites-available/zyuuuukak1n.dev.conf の <VirtualHost> 内に記述
# ------------------------------------------------------------------------------
<IfModule mod_proxy.c>
    ProxyPreserveHost On
    ProxyRequests Off

    <Proxy *>
        Require all granted
    </Proxy>

    # /tool/github-description へのアクセスを 127.0.0.1:8085 へ転送
    # ※ 末尾のスラッシュに注意 (/tool/github-description/ -> http://127.0.0.1:8085/)
    ProxyPass /tool/github-description/ http://127.0.0.1:8085/ connectiontimeout=10 timeout=60
    ProxyPassReverse /tool/github-description/ http://127.0.0.1:8085/

    # 末尾スラッシュなしのリクエスト (/tool/github-description) を補正リダイレクト
    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteRule ^/tool/github-description$ /tool/github-description/ [R=301,L]
    </IfModule>

    # プロキシプレフィックスヘッダー
    RequestHeader set X-Forwarded-Prefix "/tool/github-description"
    RequestHeader set X-Forwarded-Proto "https"
</IfModule>

# ------------------------------------------------------------------------------
# パターン2: 独立した VirtualHost ファイルとして運用する場合
# ------------------------------------------------------------------------------
<VirtualHost *:80>
    ServerName zyuuuukak1n.dev
    # ServerAlias www.zyuuuukak1n.dev
    ServerAdmin webmaster@localhost

    # ログ出力設定 (ログローテーションと運用監視用)
    ErrorLog ${APACHE_LOG_DIR}/github_description_error.log
    CustomLog ${APACHE_LOG_DIR}/github_description_access.log combined

    ProxyPreserveHost On
    ProxyRequests Off

    <Proxy *>
        Require all granted
    </Proxy>

    # toolディレクトリ配下へのプロキシ
    ProxyPass /tool/github-description/ http://127.0.0.1:8085/ connectiontimeout=10 timeout=60
    ProxyPassReverse /tool/github-description/ http://127.0.0.1:8085/

    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteRule ^/tool/github-description$ /tool/github-description/ [R=301,L]
    </IfModule>

    RequestHeader set X-Forwarded-Prefix "/tool/github-description"
    RequestHeader set X-Forwarded-Proto "https"

    ServerSignature Off
</VirtualHost>
