# ==============================================================================
# Apache2 Reverse Proxy Configuration (Docker & Subpath Support)
# Deployment target: /etc/apache2/sites-available/github-description.conf
# または既存の VirtualHost (zyuuuukak1n.dev) 内へ Include / 追記
# ==============================================================================
#
# 【公開URL】https://zyuuuukak1n.dev/tools/github-description/
# 【転送先】  http://127.0.0.1:8085/ (Dockerコンテナ待受ループバックポート)
#
# ==============================================================================

# ------------------------------------------------------------------------------
# パターン1: 既存の VirtualHost 内に追記、または Include して利用する場合 (推奨)
# 例: /etc/apache2/sites-available/zyuuuukak1n.dev.conf の <VirtualHost *:80> 内
# ------------------------------------------------------------------------------
<IfModule mod_proxy.c>
    ProxyPreserveHost On
    ProxyRequests Off

    <Proxy *>
        Require all granted
    </Proxy>

    # 1. リダイレクト補正 (ProxyPassより前に評価)
    <IfModule mod_rewrite.c>
        RewriteEngine On
        # 末尾スラッシュなしのリクエスト補正 (/tools/github-description -> /tools/github-description/)
        RewriteRule ^/tools/github-description$ /tools/github-description/ [R=301,L]
        # 旧URL (/tool/...) から新URL (/tools/...) への恒久リダイレクト
        RewriteRule ^/tool/github-description/(.*)$ /tools/github-description/$1 [R=301,L]
        RewriteRule ^/tool/github-description$ /tools/github-description/ [R=301,L]
    </IfModule>

    # 2. /tools/github-description/ へのアクセスを Docker コンテナ (127.0.0.1:8085) へ転送
    ProxyPass /tools/github-description/ http://127.0.0.1:8085/ connectiontimeout=10 timeout=60
    ProxyPassReverse /tools/github-description/ http://127.0.0.1:8085/

    # プロキシプレフィックスヘッダー
    RequestHeader set X-Forwarded-Prefix "/tools/github-description"
    RequestHeader set X-Forwarded-Proto "https"
</IfModule>

# ------------------------------------------------------------------------------
# パターン2: 独立した VirtualHost ファイル (/etc/apache2/sites-available/github-description.conf)
# ------------------------------------------------------------------------------
<VirtualHost *:80>
    ServerName zyuuuukak1n.dev
    ServerAdmin webmaster@localhost

    # 運用監視ログ
    ErrorLog ${APACHE_LOG_DIR}/github_description_error.log
    CustomLog ${APACHE_LOG_DIR}/github_description_access.log combined

    ProxyPreserveHost On
    ProxyRequests Off

    <Proxy *>
        Require all granted
    </Proxy>

    # リダイレクト補正
    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteRule ^/tools/github-description$ /tools/github-description/ [R=301,L]
        RewriteRule ^/tool/github-description/(.*)$ /tools/github-description/$1 [R=301,L]
        RewriteRule ^/tool/github-description$ /tools/github-description/ [R=301,L]
    </IfModule>

    # toolsディレクトリ配下へのプロキシ転送
    ProxyPass /tools/github-description/ http://127.0.0.1:8085/ connectiontimeout=10 timeout=60
    ProxyPassReverse /tools/github-description/ http://127.0.0.1:8085/

    RequestHeader set X-Forwarded-Prefix "/tools/github-description"
    RequestHeader set X-Forwarded-Proto "https"

    ServerSignature Off
</VirtualHost>
