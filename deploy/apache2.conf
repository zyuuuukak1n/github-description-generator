# ==============================================================================
# Apache2 VirtualHost / Reverse Proxy Configuration
# Deployment target: /etc/apache2/sites-available/github-description.conf
# ==============================================================================
#
# この設定は既存のApache2サイトに干渉せず、ポート8085でローカル待機する
# FastAPI (Uvicorn) アプリケーションへ安全にリバースプロキシします。
# ドメイン名 (your-domain.example.com) は実際の環境に合わせて変更してください。
# ==============================================================================

<VirtualHost *:80>
    ServerName github-desc.local
    # ServerAlias your-domain.example.com
    ServerAdmin webmaster@localhost

    # ログ出力設定 (ログローテーションと運用監視用)
    ErrorLog ${APACHE_LOG_DIR}/github_description_error.log
    CustomLog ${APACHE_LOG_DIR}/github_description_access.log combined

    # リバースプロキシ設定
    ProxyPreserveHost On
    ProxyRequests Off

    <Proxy *>
        Require all granted
    </Proxy>

    # バックエンド (Uvicorn: 127.0.0.1:8085) へのフォワード
    ProxyPass / http://127.0.0.1:8085/ connectiontimeout=10 timeout=60
    ProxyPassReverse / http://127.0.0.1:8085/

    # プロキシヘッダー転送
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"

    # セキュリティ設定 (内部情報漏洩防止)
    ServerSignature Off
</VirtualHost>

